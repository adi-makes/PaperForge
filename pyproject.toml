[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperforge"
version = "0.1.0"
description = "Local-first, CLI-only, agentic research-repository tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "markdown-it-py>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "cairosvg>=2.7.0",
    "pytesseract>=0.3.10",
    "matplotlib>=3.7.0"
]

[tool.setuptools.packages.find]
include = ["paperforge*"]

[project.scripts]
paperforge = "paperforge.cli:app"
